name: walleto
description: "An Application for managing wallets, transactions"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter  

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  # State management
  flutter_bloc: 9.1.1
  material_ui: ^1.5.0

  # UI
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.9
  infinite_scroll_pagination: ^5.1.1
  shimmer: ^4.0.0
  carousel_slider: ^5.1.2
  fl_chart: ^1.2.0
  lottie: ^3.6.1

  # DI
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Utils
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  async: ^2.13.1
  flutter_local_notifications: ^22.3.1
  path_provider: ^2.1.6
  dartx: 1.2.0
  device_info_plus: ^13.2.0
  rxdart: 0.28.0
  auto_route: ^11.2.0
  intl: ^0.20.3
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1
  flutter_app_badge: 2.0.2
  app_links: ^7.2.1
  flutter_screenutil: 5.9.3
  uuid: ^4.6.0
  android_intent_plus: ^6.1.0
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4
  flutter_widget_from_html: ^0.17.4
  timezone: ^0.11.1
  media_scanner: ^2.2.1

  # Networking
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: 10.0.0
  mocktail: 1.0.5

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  auto_route_generator: ^10.6.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: 0.14.4
  intl_utils: ^2.8.16

# fluttergen
flutter_gen:
  output: lib/resources/gen
  line_length: 100

  integrations:
    flutter_svg: true
    lottie: true

# dart run flutter_launcher_icons:main
flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: assets/images/walleto_logo.png
  adaptive_icon_background: "#2DD4BF"
  adaptive_icon_foreground: assets/images/walleto_adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/images/walleto_monochrome.png
  min_sdk_android: 21

# dart run flutter_native_splash:create
flutter_native_splash:
  ios: true
  android: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  image: assets/images/walleto_splash_screen.png
  color: "#050506"
  color_dark: "#050506"
  android_12:
    image: assets/images/walleto_android12_splash.png
    color: "#050506"
    icon_background_color: "#2DD4BF"
    image_dark: assets/images/walleto_android12_splash.png
    color_dark: "#050506"
    icon_background_color_dark: "#2DD4BF"

# dart run intl_utils:generate
flutter_intl:
  enabled: true
  main_locale: en_US
  output_dir: lib/resources/l10n/generated
  arb_dir: lib/resources/l10n

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
